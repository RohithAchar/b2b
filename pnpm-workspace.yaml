packages: []

# Sharp ships its binaries as platform-specific optional dependencies
# (`@img/sharp-<platform>` / `@img/sharp-libvips-<platform>`), and pnpm installs
# optional dependencies for the current platform only. Without this, the build
# machine decides which `@img/*` packages exist: on an Apple Silicon laptop the
# build produces arm64 binaries that the Linux x64 Vercel runtime cannot
# dlopen. `current` keeps local development and `pnpm test` working;
# `linux-x64` is the Vercel Node runtime (glibc, no musl suffix).
supportedArchitectures:
  - current
  - linux-x64

allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: false
  # Transformers.js image search runs CLIP through the native Node backend,
  # which fetches its prebuilt binaries in a postinstall step.
  onnxruntime-node: true
  protobufjs: false
