packages: []

# Sharp ships its binaries as platform-specific optional dependencies
# (`@img/sharp-<platform>` / `@img/sharp-libvips-<platform>`), and pnpm installs
# optional dependencies for the current platform only. `current` keeps local
# development and `pnpm test` working; `linux-x64` is the Vercel Node runtime
# (glibc). Needed by lib/admin/banners.ts image processing.
supportedArchitectures:
  - current
  - linux-x64

allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: false
  # Dev/CLI-only: local CLIP fallback for scripts + model tests, and the
  # standalone service in services/image-search/. Never imported by app routes.
  onnxruntime-node: true
  protobufjs: false
